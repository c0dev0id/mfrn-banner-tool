name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # Those branches already run the same checks inside the deploy workflow.
      - main
      - 'claude/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
